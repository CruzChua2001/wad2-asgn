name: Deploy staging

on:
  push:
    branches: [staging]
    paths:
      - "cruz-control/**"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  STAGING_DOMAIN: cruz-control-wad2-staging.vercel.app

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://${{ env.STAGING_DOMAIN }}
    defaults:
      run:
        working-directory: cruz-control
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cruz-control/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install Vercel CLI
        run: npm install --global vercel@63.1.0

      - name: Pull Vercel preview settings
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")" >> "$GITHUB_OUTPUT"

      - name: Point staging domain at this deployment
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl --fail-with-body -sS -X POST \
            "https://api.vercel.com/v2/deployments/${DEPLOY_URL#https://}/aliases?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"alias\":\"$STAGING_DOMAIN\"}"
